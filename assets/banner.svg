<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="100%" stop-color="#0F0F0F" />
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F1F1F" />
      <stop offset="50%" stop-color="#3A3A3A" />
      <stop offset="100%" stop-color="#1F1F1F" />
    </linearGradient>
    <pattern id="dotGrid" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#FFFFFF" fill-opacity="0.05" />
    </pattern>
  </defs>

  <style>
    .font-mono { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace; }
    .title { font-weight: 800; fill: #FFFFFF; letter-spacing: 3px; font-size: 21px; }
    .subtitle { font-weight: 500; fill: #A1A1AA; font-size: 12px; letter-spacing: 0.5px; }
    .tag { font-weight: 600; fill: #71717A; font-size: 10px; letter-spacing: 1px; }
    .pulse { animation: blink 2.5s infinite ease-in-out; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  </style>

  <!-- Card Frame -->
  <rect x="1" y="1" width="848" height="118" rx="8" fill="url(#bg)" stroke="url(#border)" stroke-width="1.2" />
  <rect x="1" y="1" width="848" height="118" rx="8" fill="url(#dotGrid)" />

  <!-- Top Status Bar -->
  <path d="M 1 8 A 7 7 0 0 1 8 1 L 842 1 A 7 7 0 0 1 849 8 L 849 26 L 1 26 Z" fill="#0C0C0C" stroke="#1F1F1F" stroke-width="1" />
  <circle cx="16" cy="13.5" r="3.5" fill="#262626" />
  <circle cx="28" cy="13.5" r="3.5" fill="#262626" />
  <circle cx="40" cy="13.5" r="3.5" fill="#262626" />
  <text x="56" y="17" class="font-mono tag" fill="#52525B">SYSTEM // DEV-ENVIRONMENT</text>
  
  <circle cx="828" cy="13.5" r="3.5" fill="#22C55E" class="pulse" />
  <text x="818" y="17" text-anchor="end" class="font-mono tag" fill="#71717A">SYS:ONLINE</text>

  <!-- Brand Glyph Box -->
  <g transform="translate(24, 40)">
    <rect x="0" y="0" width="56" height="56" rx="6" fill="#121212" stroke="#27272A" stroke-width="1" />
    <path d="M 16 40 L 28 16 L 40 40 Z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" />
    <circle cx="28" cy="31" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Core Identity Information -->
  <g transform="translate(96, 44)">
    <text x="0" y="18" class="font-mono title">ANIMESAO</text>
    <text x="140" y="18" class="font-mono tag">:: SOFTWARE DEVELOPER &amp; SYSTEMS BUILDER</text>
    <text x="0" y="38" class="font-mono subtitle">Building Daemonless Container Infrastructure, Backend APIs, Game Runtimes &amp; Web Platforms.</text>
    <text x="0" y="54" class="font-mono tag" fill="#52525B">PRIMARY: <tspan fill="#E4E4E7">Cardinal Ecosystem</tspan> • STACK: <tspan fill="#A1A1AA">Go • Java • Python • Nuxt • Rust • Arch Linux</tspan></text>
  </g>
</svg>
