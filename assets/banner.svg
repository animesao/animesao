<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A" />
      <stop offset="50%" stop-color="#121212" />
      <stop offset="100%" stop-color="#0E0E0E" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#262626" />
      <stop offset="50%" stop-color="#404040" />
      <stop offset="100%" stop-color="#262626" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.04" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", "Courier New", monospace; }
    .text-title { font-weight: 700; fill: #FFFFFF; letter-spacing: 2px; }
    .text-sub { font-weight: 400; fill: #A3A3A3; font-size: 13px; letter-spacing: 0.5px; }
    .text-tag { font-weight: 600; fill: #D4D4D4; font-size: 11px; letter-spacing: 1px; }
    .text-dim { fill: #737373; font-size: 11px; }
    .pulse { animation: blink 2s infinite; }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="848" height="198" rx="8" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
  
  <!-- Grid overlay -->
  <rect x="1" y="1" width="848" height="198" rx="8" fill="url(#grid)" />

  <!-- Terminal Header Bar -->
  <path d="M 1 8 A 7 7 0 0 1 8 1 L 842 1 A 7 7 0 0 1 849 8 L 849 32 L 1 32 Z" fill="#141414" stroke="#262626" stroke-width="1" />
  
  <!-- Window Controls -->
  <circle cx="20" cy="16" r="4.5" fill="#333333" />
  <circle cx="36" cy="16" r="4.5" fill="#333333" />
  <circle cx="52" cy="16" r="4.5" fill="#333333" />

  <!-- Terminal Title -->
  <text x="425" y="20" text-anchor="middle" class="mono text-dim">animesao@runtime-node: ~ / workspace / cardinal-ecosystem</text>

  <!-- Status Indicator -->
  <circle cx="810" cy="16" r="4" fill="#22C55E" class="pulse" />
  <text x="800" y="20" text-anchor="end" class="mono text-dim" font-size="10">SYS:ONLINE</text>

  <!-- Main Identity Content -->
  <!-- Monogram Logo Box -->
  <g transform="translate(36, 60)">
    <rect x="0" y="0" width="76" height="76" rx="8" fill="#171717" stroke="#333333" stroke-width="1.2" />
    <path d="M 20 54 L 38 22 L 56 54 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" />
    <circle cx="38" cy="42" r="3.5" fill="#FFFFFF" />
  </g>

  <!-- Identity Info -->
  <g transform="translate(132, 64)">
    <text x="0" y="22" class="mono text-title" font-size="24">ANIMESAO</text>
    <text x="145" y="22" class="mono text-tag" fill="#737373">:: [SYSTEMS &amp; TOOLING ARCHITECT]</text>
    
    <text x="0" y="48" class="mono text-sub">Building lightweight daemonless container runtimes, kernel tools &amp; developer ecosystems.</text>
    <text x="0" y="68" class="mono text-sub" fill="#737373">Engineering driven by precision, minimal abstractions &amp; AI-assisted workflows.</text>
  </g>

  <!-- Bottom HUD Metric Pills -->
  <g transform="translate(36, 156)">
    <!-- Pill 1: Core Project -->
    <rect x="0" y="0" width="220" height="26" rx="4" fill="#141414" stroke="#262626" stroke-width="1" />
    <text x="12" y="17" class="mono text-tag">FLAGSHIP: <tspan fill="#FFFFFF">Cardinal Runtime v2.4</tspan></text>

    <!-- Pill 2: Primary Stack -->
    <rect x="232" y="0" width="240" height="26" rx="4" fill="#141414" stroke="#262626" stroke-width="1" />
    <text x="244" y="17" class="mono text-tag">STACK: <tspan fill="#FFFFFF">Go • Rust/eBPF • Linux • Nuxt</tspan></text>

    <!-- Pill 3: Methodology -->
    <rect x="484" y="0" width="180" height="26" rx="4" fill="#141414" stroke="#262626" stroke-width="1" />
    <text x="496" y="17" class="mono text-tag">METHOD: <tspan fill="#FFFFFF">AI-Assisted Eng</tspan></text>

    <!-- Pill 4: Environment -->
    <rect x="676" y="0" width="138" height="26" rx="4" fill="#141414" stroke="#262626" stroke-width="1" />
    <text x="688" y="17" class="mono text-tag">HOST: <tspan fill="#FFFFFF">Arch Linux</tspan></text>
  </g>
</svg>